name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: Ruff — full src scan
        run: ruff check src/

  tests:
    name: Tests
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: test-key
      ODDS_API_KEY: test-key
      ANTHROPIC_API_KEY: test-key
      USE_SQLITE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run all tests
        run: python -m pytest tests/ -v --ignore=tests/integration --ignore=tests/security -k "not celery and not webhook and not discord"
