version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sip
      POSTGRES_PASSWORD: sip_pass
      POSTGRES_DB: sip_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sip -d sip_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - USE_SQLITE=false
      - DATABASE_URL=postgresql://sip:sip_pass@postgres:5432/sip_db
      - REDIS_URL=redis://redis:6379/0
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

  celery-worker:
    build: .
    command: celery -A src.workers.celery_app worker --loglevel=info -Q odds,news,picks,alerts,settlement,analytics -c 4
    environment:
      - USE_SQLITE=false
      - DATABASE_URL=postgresql://sip:sip_pass@postgres:5432/sip_db
      - REDIS_URL=redis://redis:6379/0
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

  celery-beat:
    build: .
    command: celery -A src.workers.celery_app beat --loglevel=info --scheduler celery.schedulers:PersistentScheduler
    environment:
      - USE_SQLITE=false
      - DATABASE_URL=postgresql://sip:sip_pass@postgres:5432/sip_db
      - REDIS_URL=redis://redis:6379/0
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/app

  discord-bot:
    build: .
    command: python -m src.discord_bot.run
    environment:
      - USE_SQLITE=false
      - DATABASE_URL=postgresql://sip:sip_pass@postgres:5432/sip_db
      - REDIS_URL=redis://redis:6379/0
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  pgdata:
